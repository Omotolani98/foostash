app = "foostash"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  FOOSTASH_PORT = "8080"
  FOOSTASH_MIGRATIONS_DIR = "/migrations"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
