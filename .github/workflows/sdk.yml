name: SDK

on:
  pull_request:
    paths:
      - "sdk/go/**"
      - "Makefile"
      - ".github/workflows/sdk.yml"
  push:
    branches:
      - main
    paths:
      - "sdk/go/**"
      - "Makefile"
      - ".github/workflows/sdk.yml"

jobs:
  test:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod

      - run: make sdk-vet
      - run: make sdk-test
