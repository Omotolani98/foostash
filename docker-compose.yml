services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foostash
      POSTGRES_PASSWORD: foostash
      POSTGRES_DB: foostash
    volumes:
      - foostash-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foostash -d foostash"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  foostash:
    image: ghcr.io/omotolani98/foostash:${FOOSTASH_IMAGE_TAG:-latest}
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FOOSTASH_PG_URL: postgres://foostash:foostash@postgres:5432/foostash?sslmode=disable
      FOOSTASH_LISTEN_ADDR: ":8400"
    ports:
      - "8400:8400"
    restart: unless-stopped

volumes:
  foostash-pgdata:
