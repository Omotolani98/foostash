services:
  foostash:
    build: .
    ports:
      - "8400:8400"
    environment:
      FOOSTASH_DB_URL: "postgres://foostash:foostash@postgres:5432/foostash?sslmode=disable"
      FOOSTASH_REDIS_URL: "redis://redis:6379"
      FOOSTASH_MASTER_KEY: "${FOOSTASH_MASTER_KEY:?set FOOSTASH_MASTER_KEY (use: docker run --rm foostash genkey)}"
      FOOSTASH_JWT_SECRET: "${FOOSTASH_JWT_SECRET:?set FOOSTASH_JWT_SECRET}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foostash
      POSTGRES_PASSWORD: foostash
      POSTGRES_DB: foostash
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foostash"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
